plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Optional: Firebase (instant notifications). Fill android/firebase.properties with the values from the
// Firebase console (Project settings → Your apps). These are not secret. Without it the app checks every 15 minutes.
def fb = new Properties()
def fbFile = rootProject.file('firebase.properties')
if (fbFile.exists()) fb.load(new FileInputStream(fbFile))

def keyProps = new Properties()
def keyFile = rootProject.file('signing.properties')
if (keyFile.exists()) keyProps.load(new FileInputStream(keyFile))

android {
    namespace 'nl.nextsolutionshq.app'
    compileSdk 35
    defaultConfig {
        applicationId 'nl.nextsolutionshq.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '3.1.0'
        buildConfigField 'String', 'SITE_URL', '"https://nextsolutionshq.nl"'
        buildConfigField 'String', 'FIREBASE_APP_ID', "\"${fb['appId'] ?: ''}\""
        buildConfigField 'String', 'FIREBASE_API_KEY', "\"${fb['apiKey'] ?: ''}\""
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', "\"${fb['projectId'] ?: ''}\""
        buildConfigField 'String', 'FIREBASE_SENDER_ID', "\"${fb['senderId'] ?: ''}\""
    }
    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile rootProject.file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation 'androidx.glance:glance-material3:1.1.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
